spring.application.name=parkmateplus

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/parkmateplus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Let Hibernate detect MySQL/PostgreSQL automatically
# Do NOT hard-code MySQLDialect here

# JWT
jwt.secret=${JWT_SECRET:ParkMatePlusSuperSecretKeyForJwtAuthentication2026Secure}
jwt.expiration=${JWT_EXPIRATION:86400000}