spring.application.name=parkmateplus

# Render provides PORT automatically
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/parkmateplus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

# JWT
jwt.secret=${JWT_SECRET:ParkMatePlusLocalJwtSecretKey2026ForDevelopmentOnly12345}
jwt.expiration=${JWT_EXPIRATION:86400000}